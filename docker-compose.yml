services:
  postgres:
    image: postgres:16-alpine
    container_name: workpilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: workpilot
      POSTGRES_PASSWORD: workpilot_pass
      POSTGRES_DB: workpilot_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workpilot -d workpilot_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
