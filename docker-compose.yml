services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: workpilot-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://workpilot:workpilot_pass@postgres:5432/workpilot_db?schema=public
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: workpilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: workpilot
      POSTGRES_PASSWORD: workpilot_pass
      POSTGRES_DB: workpilot_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workpilot -d workpilot_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
